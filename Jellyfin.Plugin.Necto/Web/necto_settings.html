<!-- necto_settings.html -->
<!-- The Settings tool. It holds one collapsible section per tool, each with its own Save. -->

<div id="NectoSettingsPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/necto_settings.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding">
                <div class="fieldDescription" data-str="HelpSettings">Sets how each tool works, while groups set who may use it.</div>
                <div id="settingsStatus" class="stolon-status-text" role="status"></div>

                <!-- Sections -->
                <!-- One section per tool, drawn from the registry. -->
                <div id="settingsSections"></div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
