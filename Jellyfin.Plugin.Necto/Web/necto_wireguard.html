<!-- necto_wireguard.html -->
<!-- The WireGuard tool. It lists the host's peers and the connections to other hosts in one table, each opening in a sidecar. -->

<div id="NectoWireGuardPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/necto_wireguard.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding stolon-stack">
                <div class="fieldDescription" data-str="WireGuardHelpTool">Lets users reach Jellyfin with their own peers, and connects this server to remote hosts.</div>
                <div id="wireguardStatus" class="stolon-status-text" role="status"></div>

                <!-- Off -->
                <!-- Shown while WireGuard is off, or while wireguard-go is not downloaded. -->
                <div id="wireguardOff" class="stolon-hidden"></div>
                <div id="wireguardNoSidecar" class="stolon-hidden" data-str="WireGuardWarnNoSidecar">wireguard-go is not downloaded. Download it in Troubleshooting to run WireGuard.</div>

                <!-- Host error and counts -->
                <!-- Why the host tunnel is down, then the counts, above the tabs so both tabs keep them. -->
                <div id="hostError" class="stolon-hidden"></div>
                <div id="wireguardCards" class="stolon-cards stolon-even stolon-hidden"></div>

                <!-- Tunnels and Usage tabs, built in script. Tunnels holds everything below. -->
                <div id="wireguardBody" class="stolon-stack stolon-hidden">
                    <!-- Both off -->
                    <!-- Shown while Host peers and Connect to hosts are both off and nothing is listed. -->
                    <div id="wireguardBothOff" class="stolon-hidden"></div>

                    <!-- Peers and connections -->
                    <!-- This server, the devices and routers that connect to it, and the hosts it connects to, in one table with
                         a type filter, and Add peer and Add connection in its toolbar. -->
                    <div id="wireguardTable"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
