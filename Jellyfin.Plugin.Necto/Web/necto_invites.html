<!-- necto_invites.html -->
<!-- The Invites tool. It counts the invites by state and lists them, and each opens a sidecar that edits it. -->

<div id="NectoInvitesPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/necto_invites.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding">
                <div class="fieldDescription" data-str="InvitesHelpPage">Lists every invite link. Open one to edit it.</div>

                <!-- Counts -->
                <!-- How many invites are in each state. -->
                <div id="inviteCards" class="stolon-cards stolon-even"></div>

                <div id="invitesStatus" class="stolon-status-text" role="status"></div>

                <!-- Invites -->
                <!-- Every invite, oldest first, with search, a state filter, Add invite, and bulk actions on the rows picked. -->
                <div id="invitesTable"></div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
