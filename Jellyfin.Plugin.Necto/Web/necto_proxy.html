<!-- necto_proxy.html -->
<!-- The Proxy tool. It shows how the proxy stands, lists its routes, lets Jellyfin trust it, and shows its visitors. -->

<div id="NectoProxyPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/necto_proxy.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding stolon-stack">
                <div class="fieldDescription" data-str="ProxyHelpPage">Forwards each host name to its service, with HTTPS and protection in front.</div>
                <!-- Off -->
                <!-- Says the proxy is off and where to turn it on, in place of its cards and sections. -->
                <div id="proxyOff" class="stolon-hidden"></div>
                <div id="proxyNotices" class="stolon-hidden"></div>
                <div id="proxyCards" class="stolon-cards stolon-words"></div>

                <!-- Tabs -->
                <!-- Routes holds the routes and the Jellyfin section below, Visitors the bans and activity, and Checks
                     what the proxy runs with, built in script. -->
                <div id="proxyTabs" class="stolon-stack">
                <!-- Routes -->
                <!-- Every route, each opening its editor. -->
                <div id="proxyRoutes"></div>
                <div id="proxyActions" class="stolon-card-list-actions">
                    <button is="emby-button" type="button" id="btnAddRoute" class="raised stolon-button stolon-primary">
                        <span class="material-icons" aria-hidden="true">add</span>
                        <span data-str="ButtonAddRoute">Add route</span>
                    </button>
                    <span id="proxyStatus" class="stolon-status-text" role="status"></span>
                </div>

                <!-- Jellyfin -->
                <!-- Lets Jellyfin trust the proxy, so it sees each visitor's address, and puts it back. -->
                <div id="proxyJellyfin"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
