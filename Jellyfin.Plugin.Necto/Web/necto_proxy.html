<!-- necto_proxy.html -->
<!-- The Proxy tool. It counts the routes by state, and lists the routes and the visitors under their own tabs. -->

<div id="NectoProxyPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/necto_proxy.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding stolon-stack">
                <div class="fieldDescription" data-str="ProxyHelpPage">Forwards each host name to its service, with HTTPS and protection in front.</div>
                <!-- Off -->
                <!-- Says the proxy is off and where to turn it on, in place of its cards and sections. -->
                <div id="proxyOff" class="stolon-hidden"></div>
                <div id="proxyNotices" class="stolon-hidden"></div>
                <div id="proxyCards" class="stolon-cards stolon-even"></div>

                <div id="proxyStatus" class="stolon-status-text" role="status"></div>

                <!-- Tabs -->
                <!-- Routes, every route in a table with search, a state filter, Add route, and bulk actions, each opening
                     its editor, and Visitors, the visits, bans, and countries, each drawn the first time it opens. -->
                <div id="proxyTabs"></div>
                <div id="proxyRoutes"></div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
