<!-- necto_storage.html -->
<!-- The Storage tool. It lists every disk and share Jellyfin uses, with what needs a look and the space they hold. -->

<div id="NectoStoragePage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select"
     data-controller="__plugin/necto_storage.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding stolon-stack">
                <div class="fieldDescription" data-str="StorageHelpStorage">Lists each disk and share Jellyfin uses, for its libraries or its own folders.</div>

                <!-- Attention -->
                <!-- What needs a look that no disk row shows, one line per problem, hidden while there is nothing. -->
                <div id="storageAttention" role="status"></div>

                <!-- Space -->
                <!-- How many disks the libraries use, and their used and free space, added up. -->
                <div id="storageSpaceCards" class="stolon-cards stolon-even"></div>

                <div id="storageCheckStatus" class="stolon-error stolon-hidden" role="status"></div>

                <!-- Disks -->
                <!-- One row per disk or share, each opened in a sidecar, with search, a filter for the disks Jellyfin uses
                     or every disk, and Refresh at the end of the toolbar. -->
                <div id="storageDisks"></div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
