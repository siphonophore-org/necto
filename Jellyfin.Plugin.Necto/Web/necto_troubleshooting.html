<!-- necto_troubleshooting.html -->
<!-- The Troubleshooting tool. It holds one collapsible section per tool, with its checks and repairs. -->

<div id="NectoTroubleshootingPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-button"
     data-controller="__plugin/necto_troubleshooting.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding">
                <div class="fieldDescription" data-str="HelpTroubleshooting">Holds the checks and repairs of each tool.</div>

                <!-- Sections -->
                <!-- One section per tool, drawn from the registry. -->
                <div id="troubleshootingSections"></div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
