<!-- necto_groups.html -->
<!-- The Groups tool. It lists the groups, Everyone first, and each opens a sidecar that edits it. -->

<div id="NectoGroupsPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/necto_groups.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding">
                <div class="fieldDescription" data-str="HelpGroups">Sets what members may do in each tool, with Everyone for users in no group.</div>

                <!-- Counts -->
                <!-- Counts the groups, their members, the users only Everyone holds, and those expiring soon. -->
                <div id="groupCards" class="stolon-cards stolon-even"></div>

                <!-- Groups -->
                <!-- Every group, Everyone first, each opening its editor. -->
                <div id="groupList"></div>
                <div class="stolon-card-list-actions">
                    <button is="emby-button" type="button" id="btnAddGroup" class="raised stolon-button stolon-primary">
                        <span class="material-icons" aria-hidden="true">add</span>
                        <span data-str="ButtonAddGroup">Add group</span>
                    </button>
                    <span id="groupsStatus" class="stolon-status-text" role="status"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
