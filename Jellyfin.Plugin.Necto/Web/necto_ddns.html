<!-- necto_ddns.html -->
<!-- The DDNS tool. It counts the records beside the public addresses the last run found and lists the records in a table, each opening an editor sidecar. -->

<div id="NectoDdnsPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox"
     data-controller="__plugin/necto_ddns.js">
    <div data-role="content">
        <div class="content-primary">
            <div class="verticalSection verticalSection-extrabottompadding">
                <div class="fieldDescription" data-str="DdnsHelpPage">Keeps each DNS name pointed at this server's public address.</div>
                <div id="ddnsNotices"></div>

                <!-- Counts -->
                <!-- How many records are in each state, and the public addresses the last run found. -->
                <div id="ddnsCards" class="stolon-cards stolon-even stolon-words"></div>

                <div id="ddnsStatus" class="stolon-status-text" role="status"></div>

                <!-- Records -->
                <!-- Every record, with search, a state filter, Add record and Update now, and bulk actions on the rows picked. -->
                <div id="ddnsRecords"></div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <link rel="stylesheet" href="configurationpage?name=necto_stolon.css">
    <link rel="stylesheet" href="configurationpage?name=necto_shared.css">

</div>
