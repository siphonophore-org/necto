name: "Necto"
guid: "a8b5ecb0-fc00-428b-85e8-74b85820166d"
imageUrl: "https://raw.githubusercontent.com/siphonophore-org/siphonophore/main/brand/necto/catalog.svg"
version: "12.4.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Tools to keep your Jellyfin server reachable, secure and healthy."
description: >
  Necto is the Siphonophore administration plugin. It brings seven JPKribs plugins into one, built on Stolon, with one place for permissions (groups) and one place for notifications.
category: "Administration"
owner: "siphonophore"
artifacts:
- "Jellyfin.Plugin.Necto.dll"
- "Tmds.DBus.Protocol.dll"
- "Yarp.ReverseProxy.dll"
- "System.IO.Hashing.dll"
- "MaxMind.Db.dll"
- "Certes.dll"
- "BouncyCastle.Cryptography.dll"
changelog:
  added:
  - "The first release of Necto"
  - "Groups, with members, a permission section for every tool, and Everyone for users in no group"
  - "Account rules on groups from User Management, with password requirements, expiry, inactivity, and session cleanup"
  - "Settings and Troubleshooting, with a section per tool"
  - "WireGuard from the WireGuard plugin, with the host, peers, connections, DNS, and limits, and wireguard-go downloaded when WireGuard is turned on"
  - "Scripts from the Scripts plugin, with triggers, conditions, steps, secrets, variables, history, export, and import, run for the groups that run them"
  - "Pages from Custom Pages, with pages, images, server routes, and stores. Who may open a signed in page is set on groups, and store writes go to Notifications"
  - "Storage from Storage Manager, with disks, space, SMART health, missing disks and remounting, formatting, new folders, and libraries per disk. Its alerts go to Notifications"
  - "Notifications, with browser notifications, Jellyfin messages, Discord, webhooks, email, and the activity log, a test for each channel, and a send log. Groups pick the events and channels their members get, and each post channel picks what its posts carry"
  - "Invites from User Management, with PINs, limits, expiry, QR codes, and the signup page at /invites, and a page where members make their own invites as their groups allow"
  - "Group templates from User Management, which write Access and features and Preferences onto members, taking the first group's in group order"
  - "DDNS, with several records, each with its own provider, credentials, name and update interval, and records that follow the proxy's host names"
  - "Proxy, a reverse proxy to any service, with routes from the Jellyfin, Jellyfin LAN and Blank templates, a certificate per route by HTTP or DNS challenge or upload, and bans, rate limits, locations and trusted networks"
  - "Requests, with the request page at /requests, Radarr and Sonarr, discovery from TMDb, the blocklist, and imports"
  - "Issues, with the issue page at /issues, states, notes, and a check for changed files"
  - "One sign in for the request, issue, invite, and custom pages, drawn as the web client's sign in page, whose Remember me signs the web client in too"
  - "Dashboard, with a status card for each tool that is on, one world map of the proxy's visitors and the WireGuard tunnels, the share card, and Necto's recent activity"
  - "No password, key, or token reaches a page through the plugin configuration, and saving any page keeps every stored secret"
  - "Each request and issue event posts to Discord in its own color"
  - "A switch for each of Requests, Issues, Invites, Proxy, DDNS, VPN, Scripts, Pages, and Storage, named Enable and the tool, such as Enable storage, with the tool's settings under it. A fresh install has all nine off, and a tool that is off leaves the sidebar, the Dashboard, the group editor, and Troubleshooting, and does nothing until it is turned on"
  - "Groups follows Dashboard in the sidebar, since it is always on"
  - "Menu links in Settings, which edits the web client's side menu, with an icon picker, the server's own pages to pick from, and the Requests and Issues links kept while their tools are on"
  - "Every reset and action row in Troubleshooting leads with its icon tile"
  developer:
  - "ToolSwitches.All lists the tools with a switch, and each tool's visibleWhen in necto_shared.js matches it"
  - "Issues clean up on their own task, IssuesCleanup, apart from RequestsCleanup"
  - "GET and PUT /Necto/MenuLinks read and save the web client's menuLinks, keeping every other key of its config.json"
  - "Routes under /Groups list, create, save, and delete groups, list users with their groups, and give a user's permissions"
  - "Routes under /WireGuard give the tunnels' state and usage, the tunnel ends for the Dashboard map, change peers and connections, and download wireguard-go"
  - "Routes under /Scripts give the editor's catalog and the script names, test and run scripts, take webhooks, and read and clear the run history"
  - "The Release wgsidecar workflow builds wgsidecar from sidecar/ on wireguard-go and publishes it as the release wgsidecar-1.0.0"
  - "Events wireguard.connected, wireguard.disconnected, wireguard.connection-established, wireguard.connection-lost, wireguard.data-limit, wireguard.failed, and scripts.failed go to Notifications"
  - "Routes under /Pages list the pages, give and clear a store's records, and check a configuration. The pages keep their own addresses under /pages"
  - "Routes under /Storage check the disks, give the format options, format a disk, and make a folder"
  - "Routes under /Notifications serve the channels, tests, settings, send log, VAPID key, subscriptions, and the shared service worker"
  - "Routes under /Invites serve the Invites tool and members' invites, and /invites serves the member page and the signup page"
  - "PUT /Groups/Order reorders the groups and POST /Groups/Templates/Apply writes the templates"
  - "Each tool lists its events as NectoEventInfo in a static <Tool>Events class that Notifications finds by reflection, and a test checks that every key a tool sends is listed"
  - "Routes under /Ddns and /Proxy, and /Proxy/Visitors for the visitor tables"
  - "Events ddns.failed, ddns.paused, ddns.recovered, ddns.detection_failed, proxy.banned, proxy.certificate_expiring, proxy.certificate_failed, proxy.certificate_issued, proxy.start_failed, proxy.unreachable and proxy.visitors_hidden, listed in DdnsEvents and ProxyEvents"
  - "Routes under /Requests and /Issues serve the request and issue pages and their data, and the Requests and Issues events are listed in RequestEvents and IssueEvents"
  - "Routes under /Dashboard give the world map, with the WireGuard tunnel ends placed by the location database, and Necto's recent activity"
  - "Strings that more than one tool uses take neutral keys, such as ButtonClear and LabelSignedIn"
  - "Notifications secrets live in Jellyfin.Plugin.Necto.Notifications.Secrets.json, and every other secret setting carries KeptSecretConverter, so JSON writes it as the kept marker except through Stolon's SecretJson"
  - "The Requests database drops its unused HeldMessages and PushSubscriptions tables at schema version 19"
  - "Uses Siphonophore.Stolon 12.4.11, whose SecretJson, KeptSecretConverter, OwnerOnly, AtomicFile, ProtectedJsonFileStore, JsonWebPushStore, JsonNotifyHeldStore, WebClientCheck, and WebClientJson replace the local copies, and whose h, createResetRow, createResetGroup, bindTileToSwitch, createSaveBars, the field builders, t.plural, runScheduledTask, createWebPushToggle, banner items, and the tool app's visibleWhen replace the page helpers"
